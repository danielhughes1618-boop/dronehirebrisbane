<style>
:root{
  color-scheme: light;
  --page:#f9f9f7;
  --surface:#fcfcfb;
  --surface-2:#f2f1ee;
  --text:#0b0b0b;
  --text-2:#52514e;
  --muted:#898781;
  --grid:#e1e0d9;
  --border:rgba(11,11,11,0.10);
  --car1:#2a78d6;
  --car2:#eb6834;
  --car3:#1baf7a;
  --good:#0ca30c;
  --warning:#fab219;
  --critical:#d03b3b;
  --seq:#256abf;
  --seq-track:#e1e0d9;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d0d0d;
    --surface:#1a1a19;
    --surface-2:#232322;
    --text:#ffffff;
    --text-2:#c3c2b7;
    --muted:#898781;
    --grid:#2c2c2a;
    --border:rgba(255,255,255,0.10);
    --car1:#3987e5;
    --car2:#d95926;
    --car3:#199e70;
    --good:#0ca30c;
    --warning:#fab219;
    --critical:#e66767;
    --seq:#3987e5;
    --seq-track:#2c2c2a;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d;
  --surface:#1a1a19;
  --surface-2:#232322;
  --text:#ffffff;
  --text-2:#c3c2b7;
  --muted:#898781;
  --grid:#2c2c2a;
  --border:rgba(255,255,255,0.10);
  --car1:#3987e5;
  --car2:#d95926;
  --car3:#199e70;
  --good:#0ca30c;
  --warning:#fab219;
  --critical:#e66767;
  --seq:#3987e5;
  --seq-track:#2c2c2a;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--page);
  color:var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
}
button, select, input{ font-family: inherit; }
h1,h2,h3,p{ margin:0; }
#cr-app{ max-width:640px; margin:0 auto; padding:16px; padding-bottom:32px; }

.cr-topbar{
  position:sticky; top:0; z-index:5;
  background:var(--page);
  padding:14px 16px 10px;
  border-bottom:1px solid var(--border);
}
.cr-topbar h1{ font-size:20px; font-weight:800; }
.cr-topbar .cr-date{ color:var(--text-2); font-size:14px; margin-top:2px; }

.cr-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:14px;
}
.cr-section-title{ font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); margin-bottom:10px; }

.cr-row{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  min-height:56px; padding:8px 4px; border-bottom:1px solid var(--grid);
}
.cr-row:last-child{ border-bottom:none; }
.cr-row-name{ font-size:17px; font-weight:600; display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
.cr-row-name span.cr-name-text{ overflow-wrap:break-word; }

.cr-badge{
  display:inline-flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:800; padding:3px 7px; border-radius:999px;
  flex-shrink:0;
}
.cr-badge-tl{ background:var(--car1); color:#fff; }
.cr-badge-atl{ background:var(--car2); color:#fff; }

.cr-toggle{
  appearance:none; -webkit-appearance:none;
  width:56px; height:32px; border-radius:999px;
  background:var(--grid); position:relative; cursor:pointer; flex-shrink:0;
  border:1px solid var(--border); transition: background .15s;
}
.cr-toggle::after{
  content:""; position:absolute; top:2px; left:2px; width:26px; height:26px;
  border-radius:50%; background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.3);
  transition: transform .15s;
}
.cr-toggle.cr-present{ background:var(--good); }
.cr-toggle.cr-present::after{ transform: translateX(24px); }
.cr-toggle-label{ font-size:12px; font-weight:700; color:var(--muted); min-width:52px; text-align:right; }
.cr-toggle-label.cr-is-present{ color:var(--good); }
.cr-toggle-label.cr-is-absent{ color:var(--critical); }

.cr-btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; min-height:56px; border-radius:var(--radius);
  font-size:17px; font-weight:800; border:none; cursor:pointer;
  padding:12px 16px;
}
.cr-btn-primary{ background:var(--car1); color:#fff; }
.cr-btn-secondary{ background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
.cr-btn-danger{ background:var(--critical); color:#fff; }
.cr-btn-ghost{ background:transparent; color:var(--car1); border:1px solid var(--border); }
.cr-btn:disabled{ opacity:0.45; cursor:not-allowed; }
.cr-btn-row{ display:flex; gap:10px; }
.cr-btn-row .cr-btn{ flex:1; }
.cr-btn-sm{ min-height:40px; font-size:14px; padding:8px 12px; }

.cr-status-line{
  font-size:15px; color:var(--text-2); padding:6px 4px 14px; line-height:1.4;
}
.cr-status-line.cr-blocked{ color:var(--critical); font-weight:700; }

.cr-disclosure summary{
  list-style:none; cursor:pointer; font-weight:700; padding:10px 4px;
  display:flex; align-items:center; justify-content:space-between;
}
.cr-disclosure summary::-webkit-details-marker{ display:none; }
.cr-disclosure summary::after{ content:"▸"; color:var(--muted); transition: transform .15s; }
.cr-disclosure[open] summary::after{ transform: rotate(90deg); }

.cr-pin-row{ display:flex; flex-direction:column; gap:6px; padding:10px 4px; border-bottom:1px solid var(--grid); }
.cr-pin-row:last-child{ border-bottom:none; }
.cr-pin-controls{ display:flex; flex-direction:column; gap:8px; }
.cr-select{
  width:100%; min-height:44px; border-radius:10px;
  border:1px solid var(--border); background:var(--surface-2); color:var(--text);
  padding:8px 10px; font-size:15px;
}

.cr-warning-banner{
  background:rgba(250,178,25,0.14); border:1px solid var(--warning);
  border-radius:var(--radius); padding:12px 14px; margin-bottom:14px;
}
.cr-warning-banner.cr-critical{ background:rgba(208,59,59,0.12); border-color:var(--critical); }
.cr-warning-banner-title{ font-weight:800; font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.cr-warning-banner ul{ margin:0; padding-left:20px; font-size:14px; color:var(--text-2); }
.cr-warning-banner.cr-critical ul{ color:var(--text); }

.cr-car-card{ border-radius:var(--radius); border:1px solid var(--border); margin-bottom:14px; overflow:hidden; background:var(--surface); }
.cr-car-head{ padding:12px 16px; color:#fff; }
.cr-car-head h3{ font-size:16px; font-weight:800; }
.cr-driver-row{
  display:flex; align-items:center; gap:10px; padding:12px 16px;
  background:var(--surface-2); border-bottom:1px solid var(--border);
  cursor:pointer;
}
.cr-driver-icon{ width:30px; height:30px; flex-shrink:0; }
.cr-driver-text{ flex:1; min-width:0; }
.cr-driver-text .cr-driver-label{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
.cr-driver-text .cr-driver-name{ font-size:17px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cr-driver-name.cr-no-driver{ color:var(--critical); }
.cr-chevron{ color:var(--muted); font-size:18px; }

.cr-crew-list{ padding:8px 10px; display:flex; flex-wrap:wrap; gap:8px; }
.cr-chip{
  display:flex; align-items:center; gap:6px;
  background:var(--surface-2); border:2px solid transparent;
  border-radius:999px; padding:10px 14px; font-size:15px; font-weight:600;
  cursor:pointer; min-height:44px;
}
.cr-chip.cr-selected{ border-color:var(--car1); background:rgba(42,120,214,0.14); }
.cr-chip.cr-is-driver{ background:var(--surface); box-shadow: inset 0 0 0 1.5px var(--grid); }

.cr-seat-count{ font-size:12px; color:rgba(255,255,255,.85); font-weight:700; }

.cr-history-day{ border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:14px; background:var(--surface); }
.cr-history-day-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.cr-history-day-head h3{ font-size:16px; font-weight:800; }
.cr-history-car{ font-size:14px; margin-bottom:8px; padding-left:10px; border-left:4px solid var(--grid); }
.cr-history-car b{ display:block; }
.cr-history-actions{ display:flex; gap:8px; margin-top:10px; }

.cr-tally-row{ padding:12px 4px; border-bottom:1px solid var(--grid); }
.cr-tally-row:last-child{ border-bottom:none; }
.cr-tally-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
.cr-tally-name{ font-weight:700; font-size:16px; }
.cr-tally-meta{ font-size:12px; color:var(--muted); }
.cr-tally-bar-track{ height:14px; border-radius:8px; background:var(--seq-track); overflow:hidden; display:flex; align-items:center; }
.cr-tally-bar-fill{ height:100%; background:var(--seq); border-radius:8px; min-width:6px; }
.cr-tally-count{ font-size:13px; font-weight:800; color:var(--text-2); margin-left:8px; white-space:nowrap; }
.cr-tally-bar-row{ display:flex; align-items:center; }

.cr-empty-state{ text-align:center; color:var(--muted); padding:40px 16px; font-size:15px; }

.cr-toast{
  position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(20px); background:var(--text); color:var(--page);
  padding:10px 18px; border-radius:999px; font-size:14px; font-weight:700;
  opacity:0; transition: opacity .2s, transform .2s; pointer-events:none; z-index:50;
  max-width:88vw; text-align:center;
}
.cr-toast.cr-show{ opacity:1; transform:translateX(-50%) translateY(0); }

.cr-modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:flex-end;
  justify-content:center; z-index:60; padding:16px;
}
.cr-modal{
  background:var(--surface); border-radius:18px; padding:20px; width:100%; max-width:420px;
  margin-bottom:calc(8px + env(safe-area-inset-bottom));
}
.cr-modal h3{ font-size:17px; font-weight:800; margin-bottom:8px; }
.cr-modal p{ font-size:14px; color:var(--text-2); margin-bottom:16px; line-height:1.5; }

.cr-navbar{
  position:fixed; left:0; right:0; bottom:0; z-index:10;
  background:var(--surface); border-top:1px solid var(--border);
  display:flex; padding-bottom:env(safe-area-inset-bottom);
}
.cr-navbtn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:10px 4px 8px; background:none; border:none; color:var(--muted);
  font-size:11px; font-weight:700; cursor:pointer; min-height:60px;
}
.cr-navbtn svg{ width:22px; height:22px; }
.cr-navbtn.cr-active{ color:var(--car1); }

.cr-textarea{
  width:100%; min-height:120px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); padding:10px; font-size:14px;
  font-family: ui-monospace, monospace; resize:vertical;
}
.cr-input{
  width:100%; min-height:48px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); padding:10px 12px; font-size:16px;
}
.cr-field{ margin-bottom:12px; }
.cr-field label{ display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em; }

.cr-link-btn{ background:none; border:none; color:var(--car1); font-weight:700; font-size:14px; cursor:pointer; padding:6px; }
</style>

<body>
<div id="cr-app"></div>
<div id="cr-toast" class="cr-toast"></div>
<div id="cr-modal-root"></div>
<nav class="cr-navbar" id="cr-navbar"></nav>

<script>
(function(){
"use strict";

var STORAGE_KEY = "crewRosterV1";

function defaultState(){
  var people = [
    {id:"tl", name:"Team Leader", role:"TL"},
    {id:"atl", name:"Assistant Team Leader", role:"ATL"}
  ];
  for(var i=1;i<=10;i++){ people.push({id:"bo"+i, name:"Build Officer "+i, role:"BO"}); }
  return {
    people: people,
    vehicles: [
      {id:"v1", name:"Car 1"},
      {id:"v2", name:"Car 2"},
      {id:"v3", name:"Car 3"}
    ],
    history: [],
    draft: null
  };
}

function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    var parsed = JSON.parse(raw);
    var d = defaultState();
    if(Array.isArray(parsed.people) && parsed.people.length) d.people = parsed.people;
    if(Array.isArray(parsed.vehicles) && parsed.vehicles.length) d.vehicles = parsed.vehicles;
    if(Array.isArray(parsed.history)) d.history = parsed.history;
    if(parsed.draft) d.draft = parsed.draft;
    return d;
  }catch(e){
    console.warn("crew-roster: failed to load saved data, starting fresh", e);
    return defaultState();
  }
}

var persistOk = true;
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    persistOk = true;
  }catch(e){
    if(persistOk) toast("Could not save — your browser storage may be full or private.");
    persistOk = false;
    console.warn("crew-roster: failed to save", e);
  }
}

var state = loadState();
var ui = { route:"home", selectedPersonId:null, pinsOpen:false, driverPickerCar:null, editingHistoryDate:null };

function todayStr(){
  var d = new Date();
  var mm = String(d.getMonth()+1).padStart(2,"0");
  var dd = String(d.getDate()).padStart(2,"0");
  return d.getFullYear()+"-"+mm+"-"+dd;
}
function formatDateLong(iso){
  var parts = iso.split("-").map(Number);
  var d = new Date(parts[0], parts[1]-1, parts[2]);
  return d.toLocaleDateString(undefined, {weekday:"long", year:"numeric", month:"long", day:"numeric"});
}
function formatDateShort(iso){
  var parts = iso.split("-").map(Number);
  var d = new Date(parts[0], parts[1]-1, parts[2]);
  return d.toLocaleDateString(undefined, {weekday:"short", year:"numeric", month:"short", day:"numeric"});
}

function ensureTodayDraft(){
  var today = todayStr();
  if(!state.draft || state.draft.date !== today){
    state.draft = { date: today, absentIds: [], pins: {}, cars: null, warnings: [], savedAt: null, dirty:false };
  }
}
ensureTodayDraft();

function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function personById(id){ return state.people.filter(function(p){ return p.id===id; })[0] || null; }
function vehicleById(id){ return state.vehicles.filter(function(v){ return v.id===id; })[0] || null; }
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

function driverStats(history, personId){
  var drives = 0, lastDate = null;
  for(var i=0;i<history.length;i++){
    var day = history[i];
    for(var c=0;c<day.cars.length;c++){
      if(day.cars[c].driverId === personId){
        drives++;
        if(!lastDate || day.date > lastDate) lastDate = day.date;
      }
    }
  }
  return {drives:drives, lastDate:lastDate};
}

function seatSizes(n, k){
  var base = Math.floor(n/k), rem = n % k;
  var sizes = new Array(k).fill(base);
  var idxs = shuffle(Array.from({length:k}, function(_,i){ return i; }));
  for(var i=0;i<rem;i++) sizes[idxs[i]] += 1;
  return sizes;
}

function currentCount(assign, idx){
  var n=0;
  for(var id in assign){ if(assign[id]===idx) n++; }
  return n;
}

function pickCarIndex(k, assign, sizes, avoidIdx){
  var candidates = [];
  for(var i=0;i<k;i++) candidates.push(i);
  if(avoidIdx!==undefined && avoidIdx!==null){
    var withoutAvoid = candidates.filter(function(i){ return i!==avoidIdx; });
    if(withoutAvoid.length) candidates = withoutAvoid;
  }
  var scored = candidates.map(function(i){ return {i:i, slack: sizes[i]-currentCount(assign,i)}; });
  var maxSlack = Math.max.apply(null, scored.map(function(s){ return s.slack; }));
  var best = shuffle(scored.filter(function(s){ return s.slack===maxSlack; }));
  return best[0].i;
}

function setsEqual(a,b){
  if(a.size!==b.size) return false;
  for(var x of a) if(!b.has(x)) return false;
  return true;
}

function isExactRepeatOfPrevious(cars, prevDay){
  if(!prevDay) return false;
  var todaySets = cars.map(function(c){ return new Set(c.crewIds); });
  var prevSets = prevDay.cars.map(function(c){ return new Set(c.crewIds); });
  return todaySets.some(function(ts){ return prevSets.some(function(ps){ return setsEqual(ts,ps); }); });
}

function generateAllocation(fullState, absentIds, pins){
  var people = fullState.people;
  var vehicles = fullState.vehicles;
  var k = vehicles.length;
  var present = people.filter(function(p){ return absentIds.indexOf(p.id)===-1; });
  var presentBOs = present.filter(function(p){ return p.role==="BO"; });

  if(presentBOs.length < 3){
    return { error: "Only "+presentBOs.length+" Build Officer"+(presentBOs.length===1?"":"s")+" present today — at least 3 are needed to crew "+k+" cars with a licensed driver each. No roster generated." };
  }

  var tl = present.filter(function(p){ return p.role==="TL"; })[0] || null;
  var atl = present.filter(function(p){ return p.role==="ATL"; })[0] || null;

  var vehicleIdxById = {};
  vehicles.forEach(function(v,i){ vehicleIdxById[v.id]=i; });

  var sizes = seatSizes(present.length, k);
  var lockedAssign = {};
  var pinnedToCar = Array.from({length:k}, function(){ return []; });
  var pinnedDriverForCar = new Array(k).fill(null);
  var presentIds = present.map(function(p){ return p.id; });

  Object.keys(pins||{}).forEach(function(personId){
    if(presentIds.indexOf(personId)===-1) return;
    var pin = pins[personId];
    if(!pin) return;
    if(pin.vehicleId && vehicleIdxById[pin.vehicleId]!==undefined){
      var idx = vehicleIdxById[pin.vehicleId];
      pinnedToCar[idx].push(personId);
      lockedAssign[personId] = idx;
      if(pin.asDriver){
        var person = personById(personId);
        if(person && person.role==="BO") pinnedDriverForCar[idx] = personId;
      }
    }
  });

  for(var i=0;i<k;i++){ if(pinnedToCar[i].length > sizes[i]) sizes[i] = pinnedToCar[i].length; }

  var warnings = [];

  var tlCar = tl ? lockedAssign[tl.id] : undefined;
  var atlCar = atl ? lockedAssign[atl.id] : undefined;
  if(tl && tlCar===undefined){
    tlCar = pickCarIndex(k, lockedAssign, sizes, atlCar);
    lockedAssign[tl.id] = tlCar;
  }
  if(atl && atlCar===undefined){
    atlCar = pickCarIndex(k, lockedAssign, sizes, tlCar);
    lockedAssign[atl.id] = atlCar;
  }
  if(tl && atl && lockedAssign[tl.id]===lockedAssign[atl.id]){
    warnings.push({level:"info", message:"Team Leader and Assistant Team Leader ended up in the same car because of a pin."});
  }

  var history = fullState.history;
  var prevDay = history.length ? history.reduce(function(a,b){ return a.date>b.date?a:b; }) : null;
  var droveLastDay = new Set(prevDay ? prevDay.cars.map(function(c){ return c.driverId; }).filter(Boolean) : []);

  function compareCandidates(a,b){
    if(a.droveLastDay !== b.droveLastDay) return a.droveLastDay ? 1 : -1;
    if(a.stats.drives !== b.stats.drives) return a.stats.drives - b.stats.drives;
    var at = a.stats.lastDate ? Date.parse(a.stats.lastDate) : -Infinity;
    var bt = b.stats.lastDate ? Date.parse(b.stats.lastDate) : -Infinity;
    if(at !== bt) return at - bt;
    return 0;
  }
  function weightedPick(sorted){
    var kk = Math.min(3, sorted.length);
    var weights = [3,2,1].slice(0,kk);
    var total = weights.reduce(function(a,b){ return a+b; },0);
    var r = Math.random()*total;
    for(var i=0;i<kk;i++){ if(r<weights[i]) return sorted[i]; r-=weights[i]; }
    return sorted[0];
  }

  var driverAssign = {};
  var usedDrivers = {};
  for(i=0;i<k;i++){
    if(pinnedDriverForCar[i]){
      driverAssign[i] = pinnedDriverForCar[i];
      usedDrivers[pinnedDriverForCar[i]] = true;
      lockedAssign[pinnedDriverForCar[i]] = i;
    }
  }
  var remainingCarIdx = shuffle(Array.from({length:k}, function(_,i){ return i; }).filter(function(i){ return driverAssign[i]===undefined; }));
  remainingCarIdx.forEach(function(i){
    var candidates = presentBOs.filter(function(bo){
      return !usedDrivers[bo.id] && (lockedAssign[bo.id]===undefined || lockedAssign[bo.id]===i);
    }).map(function(bo){ return {bo:bo, stats: driverStats(history, bo.id), droveLastDay: droveLastDay.has(bo.id)}; });
    if(candidates.length===0){
      var vname = vehicles[i].name;
      warnings.push({level:"error", message:"No eligible Build Officer left to drive "+vname+"."});
      return;
    }
    candidates.sort(compareCandidates);
    var chosen = weightedPick(candidates).bo;
    driverAssign[i] = chosen.id;
    usedDrivers[chosen.id] = true;
    lockedAssign[chosen.id] = i;
  });

  var attempts = 0, maxAttempts = 25, cars;
  var freeCount = present.filter(function(p){ return lockedAssign[p.id]===undefined; }).length;
  do{
    var trial = Object.assign({}, lockedAssign);
    var remaining = shuffle(present.filter(function(p){ return trial[p.id]===undefined; }));
    remaining.forEach(function(p){
      var idx = pickCarIndex(k, trial, sizes);
      trial[p.id] = idx;
    });
    cars = vehicles.map(function(v,i){
      var crewIds = [];
      Object.keys(trial).forEach(function(pid){ if(trial[pid]===i) crewIds.push(pid); });
      return { vehicleId: v.id, driverId: driverAssign[i]!==undefined ? driverAssign[i] : null, crewIds: crewIds };
    });
    attempts++;
  } while(attempts<maxAttempts && freeCount>0 && isExactRepeatOfPrevious(cars, prevDay));

  if(freeCount>0 && attempts>=maxAttempts && isExactRepeatOfPrevious(cars, prevDay)){
    warnings.push({level:"info", message:"Could not avoid repeating one of yesterday's exact crews given the current pins."});
  }

  return { cars: cars, warnings: warnings };
}

function validateCars(cars, people, vehicles){
  var violations = [];
  var tl = people.filter(function(p){ return p.role==="TL"; })[0];
  var atl = people.filter(function(p){ return p.role==="ATL"; })[0];
  if(tl && atl){
    var tlCar = cars.filter(function(c){ return c.crewIds.indexOf(tl.id)!==-1; })[0];
    var atlCar = cars.filter(function(c){ return c.crewIds.indexOf(atl.id)!==-1; })[0];
    if(tlCar && atlCar && tlCar===atlCar){
      violations.push({rule:"tl-atl-together", message: tl.name+" and "+atl.name+" are in the same car."});
    }
  }
  cars.forEach(function(c, i){
    var vname = (vehicles[i] && vehicles[i].name) || ("Car "+(i+1));
    if(!c.driverId){
      violations.push({rule:"no-driver", carIndex:i, message: vname+" has no driver."});
    }else{
      var driver = personById(c.driverId);
      if(!driver || driver.role!=="BO"){
        violations.push({rule:"invalid-driver", carIndex:i, message:"The driver of "+vname+" is "+(driver?driver.name+", who is "+(driver.role==="TL"?"the Team Leader":"the Assistant Team Leader"):"unknown")+" — drivers must be Build Officers."});
      }
    }
  });
  return violations;
}

}

function swapPeople(idA, idB){
  var draft = state.draft;
  var carA = null, carB = null;
  draft.cars.forEach(function(c){
    if(c.crewIds.indexOf(idA)!==-1) carA = c;
    if(c.crewIds.indexOf(idB)!==-1) carB = c;
  });
  if(!carA || !carB || carA===carB) return;
  carA.crewIds.splice(carA.crewIds.indexOf(idA),1);
  carB.crewIds.splice(carB.crewIds.indexOf(idB),1);
  carA.crewIds.push(idB);
  carB.crewIds.push(idA);
  if(carA.driverId===idA) carA.driverId = null;
  if(carB.driverId===idB) carB.driverId = null;
}

function copyDayAsText(date, cars){
  var lines = ["Crew Roster — "+formatDateShort(date), ""];
  cars.forEach(function(c){
    var v = vehicleById(c.vehicleId);
    var driver = c.driverId ? personById(c.driverId) : null;
    lines.push(v ? v.name : "Car");
    lines.push("🚗 Driver: "+(driver?driver.name:"— none —"));
    var crewNames = c.crewIds.map(function(pid){
      var p = personById(pid);
      if(!p) return "";
      var tag = p.role==="TL"?" (TL)":p.role==="ATL"?" (ATL)":"";
      return p.name+tag;
    });
    lines.push("Crew: "+(crewNames.join(", ")||"none"));
    lines.push("");
  });
  var text = lines.join("\n").trim();
  var done = function(){ toast("Copied to clipboard"); };
  var fail = function(){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("Copied to clipboard"); }
    catch(e){ toast("Could not copy — please copy manually."); }
    document.body.removeChild(ta);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, fail);
  }else{
    fail();
  }
}

      var day = state.history.filter(function(d){ return d.date===date; })[0];
      state.draft = { date: date, absentIds: computeAbsentFromCars(day.cars), pins: {}, cars: JSON.parse(JSON.stringify(day.cars)), warnings: [], savedAt: day.confirmedAt, dirty:false };
      ui.route = "result";
      render();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-copy-day]"), function(el){
    el.onclick = function(){
      var date = el.getAttribute("data-copy-day");
      var day = state.history.filter(function(d){ return d.date===date; })[0];
      copyDayAsText(day.date, day.cars);
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-delete-day]"), function(el){
    el.onclick = function(){
      var date = el.getAttribute("data-delete-day");
      showModal({
        title: "Delete this day?",
        body: "This removes the confirmed roster for "+formatDateShort(date)+" and its drives from the tally. This can't be undone.",
        confirmLabel: "Delete", danger:true,
        onConfirm: function(){
          state.history = state.history.filter(function(d){ return d.date!==date; });
          saveState(); toast("Deleted "+formatDateShort(date)); render();
        }
      });
    };
  });
}

function computeAbsentFromCars(cars){
  var presentIds = {};
  cars.forEach(function(c){ c.crewIds.forEach(function(id){ presentIds[id]=true; }); });
  return state.people.filter(function(p){ return !presentIds[p.id]; }).map(function(p){ return p.id; });
}

function renderTally(){
  var bos = state.people.filter(function(p){ return p.role==="BO"; });
  var rows = bos.map(function(p){
    var stats = driverStats(state.history, p.id);
    var daysSince = stats.lastDate ? Math.round((Date.parse(todayStr())-Date.parse(stats.lastDate))/86400000) : null;
    return { id:p.id, name:p.name, drives:stats.drives, lastDate:stats.lastDate, daysSince:daysSince };
  });
  rows.sort(function(a,b){
    if(a.drives!==b.drives) return a.drives-b.drives;
    var oa = a.daysSince===null?Infinity:a.daysSince;
    var ob = b.daysSince===null?Infinity:b.daysSince;
    return ob-oa;
  });
  var maxDrives = Math.max.apply(null, rows.map(function(r){ return r.drives; }).concat([1]));

  var body = rows.map(function(r){
    var pct = Math.max(r.drives>0 ? (r.drives/maxDrives*100) : 0, r.drives>0?4:0);
    var metaText = r.lastDate ? ("Last drove "+formatDateShort(r.lastDate)+" · "+r.daysSince+" day"+(r.daysSince===1?"":"s")+" ago") : "Never driven yet";
    return '<div class="cr-tally-row">'+
      '<div class="cr-tally-top"><span class="cr-tally-name">'+escapeHtml(r.name)+'</span><span class="cr-tally-meta">'+metaText+'</span></div>'+
      '<div class="cr-tally-bar-row"><div class="cr-tally-bar-track" style="flex:1;"><div class="cr-tally-bar-fill" style="width:'+pct+'%;"></div></div><span class="cr-tally-count">'+r.drives+' drive'+(r.drives===1?"":"s")+'</span></div>'+
    '</div>';
  }).join("");

  document.getElementById("cr-app").innerHTML =
    '<div class="cr-topbar"><h1>Driving Tally</h1><div class="cr-date">Fewest drives first — the imbalance you should fix</div></div>'+
    '<div class="cr-card">'+(body||'<div class="cr-empty-state">No drives recorded yet.</div>')+'</div>'+
    '<button class="cr-btn cr-btn-secondary" id="cr-export-csv">Export history as CSV</button>';

  document.getElementById("cr-export-csv").onclick = exportCsv;
}

function csvEscape(v){
  var s = String(v==null?"":v);
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function exportCsv(){
  var rows = [["Date","Vehicle","Driver","Crew","Team Leader In Car","Assistant Team Leader In Car"]];
  var days = state.history.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
  days.forEach(function(day){
    day.cars.forEach(function(c){
      var v = vehicleById(c.vehicleId);
      var driver = c.driverId ? personById(c.driverId) : null;
      var crewNames = c.crewIds.map(function(pid){ var p=personById(pid); return p?p.name:"(removed)"; });
      var tlIn = c.crewIds.some(function(pid){ var p=personById(pid); return p && p.role==="TL"; });
      var atlIn = c.crewIds.some(function(pid){ var p=personById(pid); return p && p.role==="ATL"; });
      rows.push([day.date, v?v.name:c.vehicleId, driver?driver.name:"", crewNames.join("; "), tlIn?"Y":"N", atlIn?"Y":"N"]);
    });
  });
  var csv = rows.map(function(r){ return r.map(csvEscape).join(","); }).join("\r\n");
  var blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "crew-roster-history-"+todayStr()+".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("CSV downloaded");
}

function renderSetup(){
  var leaders = state.people.filter(function(p){ return p.role==="TL"||p.role==="ATL"; });
  var bos = state.people.filter(function(p){ return p.role==="BO"; });

  function nameField(p){
    return '<div class="cr-field"><label>'+(p.role==="BO"?"Build Officer":(p.role==="TL"?"Team Leader":"Assistant Team Leader"))+'</label>'+
      '<input class="cr-input" type="text" value="'+escapeHtml(p.name)+'" data-person-name="'+p.id+'"></div>';
  }
  var leaderFields = leaders.map(nameField).join("");
  var boFields = bos.map(nameField).join("");
  var vehicleFields = state.vehicles.map(function(v){
    return '<div class="cr-field"><label>Vehicle</label><input class="cr-input" type="text" value="'+escapeHtml(v.name)+'" data-vehicle-name="'+v.id+'"></div>';
  }).join("");

  document.getElementById("cr-app").innerHTML =
    '<div class="cr-topbar"><h1>Setup</h1><div class="cr-date">Names save automatically</div></div>'+
    '<div class="cr-card"><div class="cr-section-title">Leadership</div>'+leaderFields+'</div>'+
    '<div class="cr-card"><div class="cr-section-title">Build Officers</div>'+boFields+'</div>'+
    '<div class="cr-card"><div class="cr-section-title">Vehicles</div>'+vehicleFields+'</div>'+
    '<div class="cr-card">'+
      '<div class="cr-section-title">Data</div>'+
      '<div class="cr-btn-row" style="margin-bottom:10px;">'+
        '<button class="cr-btn cr-btn-secondary" id="cr-export-csv-2">Export CSV</button>'+
      '</div>'+
      '<button class="cr-btn cr-btn-danger" id="cr-wipe-all">Wipe all data</button>'+
    '</div>';

  Array.prototype.forEach.call(document.querySelectorAll("[data-person-name]"), function(el){
    el.onchange = function(){
      var id = el.getAttribute("data-person-name");
      var val = el.value.trim();
      var p = personById(id);
      if(p) p.name = val || p.name;
      saveState(); toast("Saved"); render();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-vehicle-name]"), function(el){
    el.onchange = function(){
      var id = el.getAttribute("data-vehicle-name");
      var val = el.value.trim();
      var v = vehicleById(id);
      if(v) v.name = val || v.name;
      saveState(); toast("Saved"); render();
    };
  });
  document.getElementById("cr-export-csv-2").onclick = exportCsv;
  document.getElementById("cr-wipe-all").onclick = function(){
    showModal({
      title: "Wipe all data?",
      body: "This permanently deletes all names, vehicles, history and driving tallies from this device. This cannot be undone.",
      confirmLabel: "Wipe everything", danger:true,
      onConfirm: function(){
        localStorage.removeItem(STORAGE_KEY);
        state = defaultState();
        ensureTodayDraft();
        ui.route = "home";
        toast("All data wiped");
        render();
      }
    });
  };
}

var lastRenderedRoute = null;
function render(){
  if(ui.route==="home") renderHome();
  else if(ui.route==="result") renderResult();
  else if(ui.route==="history") renderHistory();
  else if(ui.route==="tally") renderTally();
  else if(ui.route==="setup") renderSetup();
  renderNav();
  if(ui.route !== lastRenderedRoute){
    window.scrollTo(0,0);
    lastRenderedRoute = ui.route;
  }
}

if(state.draft && state.draft.cars && state.draft.date===todayStr()){
  ui.route = "result";
}
render();

window.__crewRosterTest = {
  generateAllocation: generateAllocation,
  validateCars: validateCars,
  seatSizes: seatSizes,
  driverStats: driverStats,
  getState: function(){ return state; },
  setState: function(s){ state = s; ensureTodayDraft(); saveState(); ui.route="home"; render(); },
  swapPeople: swapPeople,
  render: render,
  setRoute: function(r){ ui.route = r; render(); }
};

})();
</script>
</body>
</html>
